name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: ./.github/actions/build

      - name: Bundle XMBar.app
        run: scripts/bundle-app.sh release

      - name: Zip app
        run: ditto -c -k --keepParent build/XMBar.app build/XMBar.zip

      - uses: actions/upload-artifact@v4
        with:
          name: XMBar-${{ github.sha }}
          path: build/XMBar.zip
          if-no-files-found: error
