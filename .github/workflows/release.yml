name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0  # full history: CFBundleVersion = commit count

      - uses: ./.github/actions/build

      - name: Determine version
        id: ver
        env:
          TAG: ${{ github.ref_name }}
        run: |
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Bundle XMBar.app
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: scripts/bundle-app.sh release

      - name: Package DMG and zip
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          mkdir -p dist
          scripts/make-dmg.sh build/XMBar.app "dist/XMBar-$VERSION.dmg"
          ditto -c -k --keepParent build/XMBar.app "dist/XMBar-$VERSION.zip"
          hdiutil verify "dist/XMBar-$VERSION.dmg"

      - name: Write release notes
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          cat > dist/notes.md <<NOTES
          XMBar $VERSION: a macOS menu bar app (and \`xmctl\` CLI) for Sony headphones.

          **Unofficial.** This project is not affiliated with, endorsed by, or supported by Sony.

          ### Requirements
          - macOS 13 (Ventura) or later.
          - On first run macOS asks for Bluetooth permission; allow it so XMBar can talk to your headphones.

          ### Installing
          Open the DMG and drag **XMBar** into **Applications**.

          The app is ad-hoc signed and **not notarized**, so macOS will block it on first launch. To open it, either:
          - right-click (Control-click) XMBar in Applications and choose **Open**, then confirm; or
          - try to open it once, then go to **System Settings → Privacy & Security** and click **Open Anyway**; or
          - run \`xattr -dr com.apple.quarantine /Applications/XMBar.app\` in Terminal.

          NOTES

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ver.outputs.tag }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          gh release create "$TAG" \
            "dist/XMBar-$VERSION.dmg" \
            "dist/XMBar-$VERSION.zip" \
            --title "XMBar $VERSION" \
            --notes-file dist/notes.md \
            --generate-notes \
            --verify-tag
